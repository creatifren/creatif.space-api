name: Publish to MCP Registry

# Manual only: run it from main when mcp/server.json changes
# (gh workflow run mcp-registry.yml --ref main). GitHub OIDC proves the
# io.github.creatifren/* namespace — no secrets.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish mcp/server.json
    runs-on: ubuntu-24.04
    env:
      # Pinned and signature-checked, as the registry's own guide asks;
      # bump deliberately rather than following releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version || true

      - name: Validate server.json
        run: ./mcp-publisher validate mcp/server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish mcp/server.json

      - name: Show the registry entry
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://registry.modelcontextprotocol.io/v0/servers?search=creatif" | tee registry.json
          echo
          jq '.servers[] | select(.server.name == "io.github.creatifren/creatif-space")' registry.json
