name: CI

# Pull requests run the minimum that proves them correct: PHP 8.4 on sqlite
# (PHPStan + Pest) and the MCP server on Node 22. The full matrix (PHP 8.5
# and 8.4 on sqlite, PHP 8.5 on MySQL 8) runs on push to main and in the
# merge queue, if one is turned on. A PR runs only the side it touches:
# mcp/** -> MCP job; anything else but docs/markdown -> PHP jobs; a change
# to this file -> both. Skipped jobs still report, so checks do not hang.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# One run per branch / PR: a new push cancels the older run, never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # What changed, and how much to run (no checkout, a few seconds).
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      mcp: ${{ steps.filter.outputs.mcp }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - name: Filter
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = merge_group ] || { [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; }; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" != pull_request ]; then
            { echo "php=true"; echo "mcp=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          ci=$(printf '%s\n' "$files" | grep -E '^\.github/workflows/ci\.yml$' || true)
          # mcp/** includes its README (mcp/test/readme.test.ts reads it).
          mcp=$(printf '%s\n' "$files" | grep -E '^mcp/' || true)
          # The PHP app: everything but mcp/, docs, markdown and the
          # manual-only registry workflow.
          php=$(printf '%s\n' "$files" | grep -Ev '^(mcp/|docs/)|\.md$|^\.github/workflows/mcp-registry\.yml$' || true)
          if [ -n "$php$ci" ]; then echo "php=true"; else echo "php=false"; fi >> "$GITHUB_OUTPUT"
          if [ -n "$mcp$ci" ]; then echo "mcp=true"; else echo "mcp=false"; fi >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (PHP ${{ matrix.php }}, sqlite)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Production runs 8.5; 8.4 keeps the floor honest. PRs: 8.4 only.
        php: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["8.5", "8.4"]' || '["8.4"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Pint is not enforced yet: main has 15 files with existing style
      # drift. Turn this on (`vendor/bin/pint --test`) once main is clean.

      - name: PHPStan (new errors only; existing ones are in phpstan-baseline.neon)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Pest
        run: php -d memory_limit=2G vendor/bin/pest

  # Main and the merge queue only.
  mysql:
    name: Tests (PHP 8.5, MySQL 8)
    needs: changes
    if: needs.changes.outputs.php == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Real env wins over phpunit.xml's <env> (not forced) and over .env.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_mysql, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Runs every migration on real MySQL first: an identifier over 64
      # characters (index/foreign key names) fails here, not in prod.
      - name: Migrate
        run: php artisan migrate --force --no-interaction

      - name: Pest
        run: php -d memory_limit=2G vendor/bin/pest

  mcp:
    name: MCP server (Node 22)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The MCP server and the API together, no mocks: tools/list in the
  # describeTool shape (#78) and the {code, message, next_step, details}
  # envelope for a real 402 / 403 / 404 (#76). scripts/mcp-contract-smoke.sh.
  mcp-contract:
    name: MCP contract smoke (API + MCP, sqlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-

      - name: Install API
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install and build MCP
        working-directory: mcp
        run: |
          npm ci
          npm run build

      - name: Contract smoke
        run: scripts/mcp-contract-smoke.sh
