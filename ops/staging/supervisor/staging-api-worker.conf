; Queue worker for the staging API. Copy to the supervisor conf directory,
; then: supervisorctl reread && supervisorctl update
; Replace www with the user that owns /www/wwwroot/staging-api.
[program:staging-api-worker]
command=php /www/wwwroot/staging-api/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/www/wwwroot/staging-api
process_name=%(program_name)s_%(process_num)02d
numprocs=1
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/www/wwwroot/staging-api/storage/logs/supervisor-worker.log
