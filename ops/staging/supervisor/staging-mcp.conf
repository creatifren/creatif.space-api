; The staging MCP server (Node 20.6 or later), built by deploy-staging-api.sh. Its settings
; are in /www/wwwroot/staging-api/mcp/.env (see README). Replace www with the
; user that owns the site.
[program:staging-mcp]
command=node --env-file=.env dist/index.js
directory=/www/wwwroot/staging-api/mcp
environment=NODE_ENV="production"
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/staging-api/storage/logs/supervisor-mcp.log
