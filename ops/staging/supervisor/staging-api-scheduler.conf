; The staging API's scheduler (instead of a cron line). Replace www with the
; user that owns /www/wwwroot/staging-api.
[program:staging-api-scheduler]
command=php /www/wwwroot/staging-api/artisan schedule:work
directory=/www/wwwroot/staging-api
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/staging-api/storage/logs/supervisor-scheduler.log
